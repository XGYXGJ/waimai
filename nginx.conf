server {
  listen 80;

  # 用户端
  location / {
    root /usr/share/nginx/html/user;
    try_files $uri $uri/ /index.html;
  }
  # 骑手端
  location /rider/ {
    alias /usr/share/nginx/html/rider/;
    try_files $uri $uri/ /rider/index.html;
  }
  # 商户端
  location /merchant/ {
    alias /usr/share/nginx/html/merchant/;
    try_files $uri $uri/ /merchant/index.html;
  }
  # 管理端
  location /admin/ {
    alias /usr/share/nginx/html/admin/;
    try_files $uri $uri/ /admin/index.html;
  }

  # 后端 REST
  location /api/ {
    proxy_pass http://server:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # WebSocket
  location /ws {
    proxy_pass http://server:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  # 上传文件
  location /uploads/ {
    proxy_pass http://server:8080/uploads/;
  }
}
