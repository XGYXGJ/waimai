spring:
  datasource:
    url: jdbc:mysql://mysql:3306/waimai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 密码通过环境变量 MYSQL_PASSWORD 传入（docker-compose 已配置）
    password: ${MYSQL_PASSWORD:}

  data:
    redis:
      host: redis
      port: 6379
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

waimai:
  frontend:
    # 生产环境不自动拉起前端 dev server
    auto-start: false
