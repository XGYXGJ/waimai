server:
  port: 8080

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

waimai:
  jwt:
    secret: waimai-jwt-secret-key-please-change-in-production-0123456789
    access-ttl-hours: 2
    refresh-ttl-days: 7
  ai:
    base-url: http://localhost:8000
    internal-token: dev-token-123
  upload:
    dir: ./uploads
  frontend:
    # 后端启动后自动拉起四端前端 dev server，后端关闭时自动停止（Windows/macOS/Linux 通用）
    auto-start: true
  deps:
    # 后端启动「前置」阶段（Spring 容器 refresh 之前）就把 docker 依赖拉起来，后端关闭时一起停止，
    # 这样在 IDEA 里启动 WaimaiApplication 就等于启动全部功能，而且不会有启动期连接报错。
    # 需要 Docker Desktop 已启动；Docker 没起来只会告警，不影响后端本身启动。
    # 生产环境（server 跑在容器里）请置 false，容器编排交给 docker compose / K8s
    auto-start: true
    # 需要接管的 compose 服务名；MySQL 是本机 Windows 服务（3306），不由 docker 管理（见下面的 check-database）
    services: redis,rabbitmq,ai
    # 留空 = 从工作目录向上自动查找 docker-compose.yml；也可写绝对路径固定下来
    compose-file:
    # 启动命令与 AI 健康检查的超时（秒），首次构建镜像会更久
    start-timeout-seconds: 120
    # 容器「启动完成」不等于服务「就绪」：redis(6379)/rabbitmq(5672) 的 TCP 就绪探测等待上限（秒）。
    # 不加这段等待，refresh 阶段 AMQP 监听器会在 RabbitMQ 还没监听完端口时刷一条连接报错
    ready-timeout-seconds: 60
    # 本机 MySQL（后端数据源，默认 3306）是否在启动前置阶段探测一次：连不上会打印可执行的提示，
    # 而不是等 Hikari 抛一大串 CommunicationsException
    check-database: true
    # MySQL 的 Windows 服务名：探测到端口未开时会尝试 net start（非管理员权限会失败并给出提示）；留空 = 只提示不尝试
    database-service: MySQL80
    # 发出启动命令后，等待 3306 就绪的上限（秒）
    database-ready-timeout-seconds: 30
    # 关闭时 docker compose stop 的超时（秒）
    stop-timeout-seconds: 60
    # 关闭后端时是否一起停掉这些容器；想保留依赖常驻可置 false
    stop-on-shutdown: true
