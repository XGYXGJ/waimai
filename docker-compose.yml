services:
  mysql:
    image: mysql:8.0
    container_name: waimai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: waimai123
      MYSQL_DATABASE: waimai
    ports: ["3306:3306"]
    volumes: ["./data/mysql:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7
    container_name: waimai-redis
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: waimai-mq
    ports: ["5672:5672", "15672:15672"]

  server:
    build: ./waimai-server
    container_name: waimai-server
    ports: ["8080:8080"]
    depends_on: [mysql, redis, rabbitmq]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AI_BASE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: dev-token-123
      MYSQL_PASSWORD: waimai123
    volumes: ["./uploads:/app/uploads"]

  ai:
    build: ./waimai-ai
    container_name: waimai-ai
    ports: ["8000:8000"]
    environment:
      INTERNAL_TOKEN: dev-token-123
      OLLAMA_BASE_URL: http://host.docker.internal:11434

  nginx:
    image: nginx:alpine
    container_name: waimai-nginx
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on: [server]
